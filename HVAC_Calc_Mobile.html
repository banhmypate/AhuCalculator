<section id="t1" class="on"><div class="g2c"><div class="card"><div class="r"><label><i data-t="Thông số 1|Input 1|入力1"></i><select id="k1"></select></label><label><i data-t="Giá trị|Value|値"></i><input id="x1" type="number" step="any" value="35"></label><label><i data-t="Thông số 2|Input 2|入力2"></i><select id="k2"></select></label><label><i data-t="Giá trị|Value|値"></i><input id="x2" type="number" step="any" value="60"></label></div><div id="o1"></div><button class="a" onclick="rep(1,1)" data-t="In / Lưu PDF|Print / Save PDF|印刷 / PDF保存"></button><button class="a" onclick="rep(1,0)" data-t="Tải báo cáo .html|Download report .html|レポート(.html)保存"></button></div><div class="card" id="c1"></div></div></section>
<section id="t2"><div class="card" style="padding:4px"><div id="ahu"></div></div><div class="g2c"><div class="card"><div id="o2"></div><button class="a" onclick="rep(2,1)" data-t="In / Lưu PDF|Print / Save PDF|印刷 / PDF保存"></button><button class="a" onclick="rep(2,0)" data-t="Tải báo cáo .html|Download report .html|レポート(.html)保存"></button></div><div class="card" id="c2"></div></div></section><script>
const MOBILE=true;const $=i=>document.getElementById(i);let P=101.325,lang=0;
const T=s=>{const a=s.split('|');return a[lang]||a[1]||a[0]};
/* ===== ASHRAE Fundamentals 2017 Ch.1 (Hyland-Wexler), SI ===== */
function pws(t){const T=t+273.15;const l=t<0?-5674.5359/T+6.3925247-9.677843e-3*T+6.2215701e-7*T*T+2.0747825e-9*T**3-9.484024e-13*T**4+4.1635019*Math.log(T):-5800.2206/T+1.3914993-4.8640239e-2*T+4.1764768e-5*T*T-1.4452093e-8*T**3+6.5459673*Math.log(T);return Math.exp(l)/1000}
const Wp=pw=>0.621945*pw/(P-pw),pwW=W=>P*W/(0.621945+W),Ws=t=>Wp(pws(t));
const hh=(t,W)=>1.006*t+W*(2501+1.86*t),vv=(t,W)=>0.287042*(t+273.15)*(1+1.607858*W)/P;
const tHW=(h,W)=>(h-2501*W)/(1.006+1.86*W);
const Wwb=(ts,t)=>((2501-2.326*ts)*Ws(ts)-1.006*(t-ts))/(2501+1.86*t-4.186*ts);
function bis(f,lo,hi){let fl=f(lo);for(let i=0;i<70;i++){const m=(lo+hi)/2,fm=f(m);if(fl*fm<=0)hi=m;else{lo=m;fl=fm}}return(lo+hi)/2}
const wbOf=(t,W)=>bis(ts=>Wwb(ts,t)-W,-60,t),dpOf=W=>{const pw=pwW(W);return bis(T=>pws(T)-pw,-80,100)};
const mk=(t,W)=>({t,W,rh:100*pwW(W)/pws(t),h:hh(t,W),v:vv(t,W),wb:wbOf(t,W),dp:dpOf(W),pw:pwW(W)});
function getW(t,k,x){switch(k){case'rh':return x>100||x<0?NaN:Wp(x/100*pws(t));case'wb':return x>t+1e-9?NaN:Wwb(x,t);case'dp':return x>t+1e-9?NaN:Wp(pws(x));case'w':return x/1000;case'h':return(x-1.006*t)/(2501+1.86*t)}}
function ck(k,t,W){if(!(W>=0)||W>Ws(t)*1.0005)return NaN;return{rh:100*pwW(W)/pws(t),wb:wbOf(t,W),dp:dpOf(W),w:W*1000,h:hh(t,W)}[k]}
function stateFrom(k1,x1,k2,x2){if(k1===k2)throw Error('Hai thông số phải khác nhau');if(k2==='db'){[k1,x1,k2,x2]=[k2,x2,k1,x1]}let t,W;
if(k1==='db'){t=x1;W=getW(t,k2,x2)}else{const f=t=>ck(k2,t,getW(t,k1,x1))-x2;let fa=f(-40),ok=false;
for(let a=-40;a<100&&!ok;a+=0.5){const fb=f(a+0.5);if(isFinite(fa)&&isFinite(fb)&&fa*fb<=0){t=bis(f,a,a+0.5);ok=true}fa=fb}
if(!ok)throw Error('Không tìm được trạng thái hợp lệ (kiểm tra giá trị nhập)');W=getW(t,k1,x1)}
if(!isFinite(W)||W<0||W>Ws(t)*1.0005)throw Error('Trạng thái không hợp lệ (quá bão hòa hoặc giá trị sai)');return mk(t,Math.min(W,Ws(t)))}
function adpLine(p0,p1){const d=0.01;for(let s=0;s<=80;s+=d){const t=p0[0]+s*(p1[0]-p0[0]),W=p0[1]+s*(p1[1]-p0[1]);if(W<0||t<-20)return null;if(W-Ws(t)>=0){if(s===0)return mk(t,Ws(t));const g=q=>{const tt=p0[0]+q*(p1[0]-p0[0]);return p0[1]+q*(p1[1]-p0[1])-Ws(tt)};const q=bis(g,s-d,s);const tt=p0[0]+q*(p1[0]-p0[0]);return mk(tt,Ws(tt))}}return null}


const f1=(x,d=1)=>isFinite(x)?(+x).toFixed(d):'–';
const KS={db:'Tdb °C',rh:'RH %',wb:'Twb °C',dp:'Tdp °C',w:'W g/kg',h:'h kJ/kg'};
const opts=(ks,sel)=>ks.map(k=>`<option value="${k}"${k===sel?' selected':''}>${KS[k]}</option>`).join('');
const fl=(t,h,c='')=>`<label class="${c}"><i data-t="${t}"></i>${h}</label>`;
const num=(id,v,st='any')=>`<input id="${id}" type="number" step="${st}" value="${v}" inputmode="decimal">`;
const sel=(id,o)=>`<select id="${id}">${o.map(x=>`<option value="${x[0]}" data-t="${x[1]}"></option>`).join('')}</select>`;
const sI=(id,t,k,v)=>fl('Tdb °C',num(id+'T',t,.1))+fl('Thông số 2|Param 2|項目2',`<select id="${id}K">${opts(['rh','wb','dp','w'],k)}</select>`)+fl('Giá trị|Value|値',num(id+'V',v));
$('k1').innerHTML=opts(Object.keys(KS),'db');$('k2').innerHTML=opts(Object.keys(KS),'rh');
const st=id=>stateFrom('db',+$(id+'T').value,$(id+'K').value,+$(id+'V').value);
const tbl=(rows,head)=>'<table>'+(head?'<tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr>':'')+rows.map(r=>'<tr>'+r.map((c,i)=>`<td${i==r.length-1&&!head&&r.length==3?' class="u"':''}>${c}</td>`).join('')+'</tr>').join('')+'</table>';
const stRows=s=>[[T('Nhiệt độ bầu khô Tdb|Dry-bulb Tdb|乾球温度 Tdb'),f1(s.t,2),'°C'],[T('Bầu ướt Twb|Wet-bulb Twb|湿球温度 Twb'),f1(s.wb,2),'°C'],[T('Điểm sương Tdp|Dew point Tdp|露点温度 Tdp'),f1(s.dp,2),'°C'],[T('Độ ẩm tương đối RH|Relative humidity RH|相対湿度 RH'),f1(s.rh,1),'%'],[T('Độ ẩm tuyệt đối W|Humidity ratio W|絶対湿度 W'),f1(s.W*1000,2),'g/kg'],[T('Enthalpy h|Enthalpy h|比エンタルピー h'),f1(s.h,2),'kJ/kg'],[T('Thể tích riêng v|Specific volume v|比容積 v'),f1(s.v,4),'m³/kg'],[T('Khối lượng riêng ρ|Density ρ|密度 ρ'),f1((1+s.W)/s.v,3),'kg/m³'],[T('Áp suất hơi pw|Vapor pressure pw|水蒸気分圧 pw'),f1(s.pw,3),'kPa']];
/* ===== ASHRAE-style psychrometric chart (SI) ===== */
function chart(pts,lines){const Wd=MOBILE?430:840,H=MOBILE?580:560,l=MOBILE?32:50,r=MOBILE?40:60,tp=22,b=46,pw_=Wd-l-r,ph=H-tp-b;
let tmin=Math.floor(Math.min(0,Math.min(...pts.map(p=>p.t))-4)/5)*5,tmax=Math.ceil(Math.max(50,Math.max(...pts.map(p=>p.t))+4)/5)*5,wmax=Math.max(.030,Math.ceil((Math.max(...pts.map(p=>p.W))+.004)/.005)*.005);
const X=t=>l+(t-tmin)/(tmax-tmin)*pw_,Y=W=>tp+ph*(1-W/wmax),ins=(x,y)=>x>l&&x<l+pw_&&y>tp+6&&y<tp+ph;
const path=a=>a.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
const tx=(x,y,c,t,an='middle',fs=8)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="${c}" text-anchor="${an}" font-size="${fs}">${t}</text>`;
let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Wd} ${H}" font-family="Arial,sans-serif" font-size="10"><defs><clipPath id="cp"><rect x="${l}" y="${tp}" width="${pw_}" height="${ph}"/></clipPath></defs><rect x="${l}" y="${tp}" width="${pw_}" height="${ph}" fill="#fff" stroke="#222"/>`;
for(let t=tmin;t<=tmax;t+=1)s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${tp}" y2="${tp+ph}" stroke="${t%5?'#eef0f3':'#c9ced6'}"/>`+(t%5==0?tx(X(t),tp+ph+13,'#222',t,'middle',10):'');
for(let w=0;w<=wmax+1e-9;w+=.001)s+=`<line x1="${l}" x2="${l+pw_}" y1="${Y(w)}" y2="${Y(w)}" stroke="${Math.round(w*1000)%5?'#eef0f3':'#c9ced6'}"/>`+(Math.round(w*1000)%5==0?tx(l+pw_+4,Y(w)+3,'#222',(w*1000).toFixed(0),'start',10):'');
s+=tx(l+pw_/2,H-6,'#222',T('Nhiệt độ bầu khô (°C)|Dry-bulb temperature (°C)|乾球温度 (°C)'),'middle',11)+tx(l+pw_,tp-8,'#222',T('Độ ẩm tuyệt đối W (g/kg)|Humidity ratio W (g/kg)|絶対湿度 W (g/kg)'),'end',10)+tx(l+2,tp-8,'#1d6fb8',T('Enthalpy h (kJ/kg) – xanh dương|Enthalpy h (kJ/kg) – blue|比エンタルピー h (kJ/kg) – 青'),'start',9)+'<g clip-path="url(#cp)">';
for(let v=.76;v<1.0;v+=.02){const a=[];for(let t=tmin;t<=tmax;t++){const W=(v*P/(0.287042*(t+273.15))-1)/1.607858;if(W>=-.0003&&W<=Ws(t))a.push([t,Math.max(W,0)])}if(a.length>1){s+=`<path d="${path(a)}" stroke="#a0643c" stroke-width=".8" fill="none"/>`+tx(X(a[0][0]),Y(a[0][1])-3,'#a0643c',v.toFixed(2),'middle',8)}}
for(let ts=Math.ceil(tmin);ts<=tmax;ts+=2){const w0=Ws(ts),t0=ts+(2501-2.326*ts)*w0/1.006,a=[];for(let k=0;k<=20;k++){const t=ts+(t0-ts)*k/20;a.push([t,Math.max(Wwb(ts,t),0)])}s+=`<path d="${path(a)}" stroke="#4c9a4c" stroke-width=".6" stroke-dasharray="3 2" fill="none"/>`;if(ts%4==0&&ts>0)s+=tx(X(ts)+2,Y(w0)+10,'#2e7d32',ts,'start',8)}
for(let h=-10;h<=160;h+=5){const th=bis(t=>hh(t,Ws(t))-h,-60,90),t0=h/1.006,a=[];for(let k=0;k<=20;k++){const t=th+(t0-th)*k/20;a.push([t,Math.max((h-1.006*t)/(2501+1.86*t),0)])}s+=`<path d="${path(a)}" stroke="#1d6fb8" stroke-width="${h%10?.4:.9}" fill="none"/>`;if(h%10==0&&ins(X(th)-3,Y(Ws(th))-4))s+=tx(X(th)-3,Y(Ws(th))-4,'#1d6fb8',h,'end',9)}
for(let rh=10;rh<100;rh+=10){const a=[];for(let t=tmin;t<=tmax;t++)a.push([t,Wp(rh/100*pws(t))]);s+=`<path d="${path(a)}" stroke="#b33" stroke-width=".9" fill="none"/>`;const e=a.filter(p=>p[1]<wmax*.96).pop();if(e)s+=tx(X(e[0])-3,Y(e[1])-2,'#b33',rh+'%','end',9)}
const sat=[];for(let t=tmin;t<=tmax;t+=.5)sat.push([t,Ws(t)]);s+=`<path d="${path(sat)}" stroke="#000" stroke-width="2" fill="none"/>`;
lines.forEach(L=>s+=`<path d="${path(L.p)}" stroke="${L.c}" stroke-width="2.2" ${L.d?'stroke-dasharray="6 4"':''} fill="none"/>`);
pts.forEach(p=>s+=`<circle cx="${X(p.t)}" cy="${Y(p.W)}" r="4.5" fill="${p.c}" stroke="#fff"/><text x="${X(p.t)+7}" y="${Y(p.W)-6}" font-size="12" font-weight="bold" fill="${p.c}" stroke="#fff" stroke-width="3" paint-order="stroke">${p.n}</text>`);
return s+`</g>${tx(l+4,tp+ph-4,'#333','RH% – '+T('đỏ|red|赤')+' | Twb °C – '+T('xanh lá nét đứt|green dashed|緑破線')+' | v m³/kg – '+T('nâu|brown|茶')+' | p = '+P.toFixed(2)+' kPa','start',9)}</svg>`}
/* ===== Tab 1 ===== */
let last={};
function calc1(){try{const k1=$('k1').value,k2=$('k2').value,s=stateFrom(k1,+$('x1').value,k2,+$('x2').value);
$('o1').innerHTML=tbl(stRows(s));const svg=chart([{...s,n:'●',c:'#c0392b'}],[{p:[[s.t,0],[s.t,s.W]],c:'#c0392b',d:1},{p:[[-60,s.W],[s.t,s.W]],c:'#c0392b',d:1}]);$('c1').innerHTML=svg;
last[1]={inp:tbl([[KS[k1],$('x1').value,''],[KS[k2],$('x2').value,''],[T('Áp suất khí quyển|Atmospheric pressure|大気圧'),f1(P,3),'kPa']]),res:tbl(stRows(s)),svg,title:T('Tính trạng thái không khí ẩm|Moist air state calculation|湿り空気の状態計算')}}
catch(e){$('o1').innerHTML='<div class="err">'+T(e.message)+'</div>';$('c1').innerHTML='';last[1]=null}}
/* ===== AHU figure with inline inputs ===== */
const LY=MOBILE?{vb:'0 0 360 1130',c:{oa:[8,6,344,118],ra:[8,130,344,118],on:[8,280,344,190],coil:[8,502,344,240],off:[8,774,344,140],res:[8,946,344,170]},
 art:`<rect x="2" y="266" width="356" height="660" rx="8" fill="none" stroke="#12354f" stroke-dasharray="8 4"/><g stroke="#12354f" stroke-width="2.5" fill="none" marker-end="url(#ar)"><path d="M180 248V280"/><path d="M180 470V502"/><path d="M180 742V774"/><path d="M180 914V946"/><path d="M4 65V375H8"/></g>`}:
{vb:'0 0 1060 500',c:{oa:[8,8,236,125],on:[256,8,276,150],coil:[544,8,310,205],off:[862,160,190,140],ra:[8,345,236,125],res:[370,350,540,140]},
 art:`<rect x="250" y="225" width="600" height="100" fill="#eef3f8" stroke="#12354f" stroke-width="2"/><g stroke="#12354f" fill="none"><path d="M420 225V325M560 225V325M720 225V325"/><path d="M262 235l30 40M262 275l30 40M300 235l30 40M300 275l30 40" stroke="#888"/><path d="M445 230l30 40-30 50M485 230l30 40-30 50M525 230l30 40-30 50" stroke="#2b7bb9" stroke-width="2"/><circle cx="640" cy="275" r="34" stroke-width="2"/><path d="M640 241V309M606 275H674M616 251l48 48M664 251l-48 48" stroke="#888"/></g><g font-size="11" fill="#12354f" text-anchor="middle"><text x="335" y="318">MIX / FILTER</text><text x="490" y="318">COIL</text><text x="640" y="318">FAN</text><text x="785" y="318">SA</text></g><g stroke="#12354f" stroke-width="2.5" fill="none" marker-end="url(#ar)"><path d="M126 133V275H250"/><path d="M244 408H330V325"/><path d="M850 275H862"/><path d="M860 275h0"/></g>`};
function buildAhu(){const fo=(k,h)=>{const[x,y,w,hh_]=LY.c[k];return`<foreignObject x="${x}" y="${y}" width="${w}" height="${hh_}"><div class="nd">${h}</div></foreignObject>`};const D=(id)=>`<div class="cv" id="cv_${id}"></div>`;
$('ahu').innerHTML=`<svg viewBox="${LY.vb}" style="width:100%;background:#fff"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#12354f"/></marker></defs>${LY.art}`+
fo('oa',`<h4 data-t="① Gió tươi OA|① Outdoor air OA|① 外気 OA"></h4><div class="r">${sI('oa',35,'wb',28)}</div>${D('oa')}`)+
fo('ra',`<h4 data-t="② Gió hồi RA / phòng|② Return air RA / room|② 還気 RA / 室内"></h4><div class="r">${sI('ra',25,'rh',55)}</div>${D('ra')}`)+
fo('on',`<h4 data-t="③ Hỗn hợp – ON coil|③ Mixed – coil ON|③ 混合 – コイル入口(ON)"></h4><div class="r">${fl('Lưu lượng m³/h|Airflow m³/h|風量 m³/h',num('q',10000))}${fl('Khí vào coil|Coil entering air|コイル入口空気',sel('mode',[['mix','OA+RA'],['pau','100% OA'],['ra','100% RA']]))}${fl('OA %',num('oap',30),'gm')}${fl('Quy đổi khối lượng|Mass basis|質量換算',sel('qb',[['on','v(ON)'],['std','1.2 kg/m³']]))}</div>${D('on')}`)+
fo('coil',`<h4 data-t="④ Coil lạnh|④ Cooling coil|④ 冷却コイル"></h4><div class="r">${fl('Phương pháp|Method|方式',sel('meth',[['m1','SA'],['m2','ADP+BF'],['m3','RSHF+BF']]))}${fl('BF',num('bf',0.1,.01),'g2 g3')}${fl('ADP °C',num('adpt',8,.1),'g2')}${fl('RSHF',num('rshf',0.8,.01),'g3')}${fl('Loại coil|Coil type|コイル種別',sel('ct',[['w','Nước|Water|冷水'],['dx','Gas DX|DX|DX']]))}${fl('Nước vào °C|Water in °C|入口水温 °C',num('tin',7,.1),'cw')}${fl('Nước ra °C|Water out °C|出口水温 °C',num('tout',12,.1),'cw')}${fl('Tbay hơi °C|Evap °C|蒸発温度 °C',num('tev',5,.1),'cd')}${fl('Môi chất|Refrigerant|冷媒','<input id="rf" value="R410A">','cd')}${fl('Hệ số an toàn %|Safety %|安全率 %',num('sf',10))}</div>`)+
fo('off',`<h4 data-t="⑤ OFF coil / SA|⑤ Coil OFF / SA|⑤ コイル出口(OFF) / SA"></h4><div class="r">${sI('sa',13,'rh',90)}</div>${D('off')}`)+
fo('res',`<h4 data-t="⑥ Kết quả|⑥ Results|⑥ 結果"></h4><div id="rs"></div>`)+'</svg>'}
buildAhu();
/* ===== Tab 2 ===== */
const nd=(s)=>`${f1(s.t,1)}°C | RH ${f1(s.rh,0)}% | W ${f1(s.W*1000,1)} | h ${f1(s.h,1)}`;
function calc2(){try{const mode=$('mode').value,meth=$('meth').value,ct=$('ct').value,warn=[];
const oa=st('oa'),ra=st('ra');let on;
if(mode==='pau')on=oa;else if(mode==='ra')on=ra;else{const p=+$('oap').value/100,a=p/oa.v,c=(1-p)/ra.v,x=a/(a+c),W=x*oa.W+(1-x)*ra.W,h=x*oa.h+(1-x)*ra.h;on=mk(tHW(h,W),W)}
const Q=+$('q').value,ma=$('qb').value==='on'?Q/3600/on.v:Q/3600*1.2;let off,adp,bf=NaN;
if(meth==='m1'){off=st('sa');adp=adpLine([on.t,on.W],[off.t,off.W]);if(adp)bf=(off.t-adp.t)/(on.t-adp.t)}
else{bf=+$('bf').value;if(meth==='m2'){const t=+$('adpt').value;adp=mk(t,Ws(t))}else{const R=+$('rshf').value;if(!(R>0&&R<=1))throw Error('RSHF phải trong (0;1]|RSHF must be in (0;1]|RSHFは0〜1');const k=(1.006+1.86*ra.W)*(1-R)/(2501*R);adp=adpLine([ra.t,ra.W],[ra.t-1,ra.W-k]);if(!adp)throw Error('Đường RSHF không cắt đường bão hòa|RSHF line does not meet the saturation curve|RSHF線が飽和線と交差しません')}
off=mk(adp.t+bf*(on.t-adp.t),adp.W+bf*(on.W-adp.W));$('saT').value=f1(off.t,2);$('saK').value='rh';$('saV').value=f1(off.rh,1)}
['saT','saK','saV'].forEach(i=>$(i).disabled=meth!=='m1');
if(!adp)throw Error('Không xác định được ADP|Cannot determine ADP|ADPを求められません');
const Qt=ma*(on.h-off.h),Qs=ma*(1.006+1.86*off.W)*(on.t-off.t),Ql=Qt-Qs,sf=1+(+$('sf').value)/100,Qd=Qt*sf,cond=ma*(on.W-off.W)*3600;
if(Qt<=0)warn.push('Enthalpy OFF ≥ ON: không phải làm lạnh|OFF enthalpy ≥ ON: not a cooling process|OFFのエンタルピー ≥ ON(冷却ではありません)');if(Ql<0)warn.push('Tải ẩn âm: không có ngưng tụ|Negative latent load: no condensation|潜熱が負:結露なし');
if(bf<0||bf>1)warn.push('BF ngoài 0–1|BF outside 0–1|BFが0〜1の範囲外');
const rsh=ma*(1.006+1.86*off.W)*(ra.t-off.t),rt=ma*(ra.h-off.h),rlh=rt-rsh;
const U=q=>`${f1(q,2)} kW = ${f1(q/3.517,2)} TR = ${f1(q*859.845,0)} kcal/h = ${f1(q*3.412,1)} kBTU/h`;let cw='';
if(ct==='w'){const a=+$('tin').value,b=+$('tout').value;if(b<=a)throw Error('Nước ra phải > nước vào|Water out must exceed water in|出口水温は入口水温より高く');const Lw=Qd/(4.186*0.998*(b-a));if(adp.t<=a+0.5)warn.push('ADP ≤ nhiệt độ nước vào: không khả thi|ADP ≤ entering water temperature: infeasible|ADP ≤ 入口水温:成立しません');if(off.t<=a+1)warn.push('OFF-coil quá gần nước vào (<1K)|OFF air within 1 K of entering water|OFF空気が入口水温に近すぎます(<1K)');
cw=tbl([[T('Lưu lượng nước (gồm SF)|Water flow (incl. SF)|冷水量(安全率込み)'),f1(Lw,3),'L/s'],['',f1(Lw*3.6,2),'m³/h'],[T('ΔT nước|Water ΔT|水温差'),f1(b-a,1),'K']])}
else{const e=+$('tev').value;if(e>=adp.t)warn.push('Nhiệt độ bay hơi phải thấp hơn ADP|Evaporating temperature must be below ADP|蒸発温度はADPより低く');cw=tbl([[T('Môi chất|Refrigerant|冷媒'),$('rf').value,''],[T('ADP − Tbay hơi|ADP − Tevap|ADP − 蒸発温度'),f1(adp.t-e,1),'K']])}
const big=`<div class="big"><div><b>${f1(Qt,2)} kW</b><span>${T('Tải lạnh tổng|Total cooling|全冷却能力')}</span></div><div><b>${f1(Qd,2)} kW</b><span>${T('Chọn coil (+SF)|Coil selection (+SF)|コイル選定(+安全率)')}</span></div><div><b>${f1(Qs/Qt,3)}</b><span>SHR</span></div><div><b>${f1(bf,3)}</b><span>BF | ADP ${f1(adp.t,1)}°C</span></div></div>`;
const W_=warn.map(w=>`<div class="warn">⚠ ${T(w)}</div>`).join('');
$('rs').innerHTML=big;$('cv_oa').textContent=nd(oa);$('cv_ra').textContent=nd(ra);$('cv_on').textContent=nd(on);$('cv_off').textContent=nd(off);
const sh=[['OA',oa],['RA',ra],['ON',on],['OFF/SA',off],['ADP',adp]];
const sumT=tbl([['Tdb °C',...sh.map(x=>f1(x[1].t,1))],['Twb °C',...sh.map(x=>f1(x[1].wb,1))],['RH %',...sh.map(x=>f1(x[1].rh,1))],['W g/kg',...sh.map(x=>f1(x[1].W*1000,2))],['h kJ/kg',...sh.map(x=>f1(x[1].h,1))]],['',...sh.map(x=>x[0])]);
const loads=tbl([[T('Khối lượng gió khô|Dry-air mass flow|乾き空気質量流量'),f1(ma,3),'kg/s'],[T('Tải lạnh tổng|Total cooling load|全冷却負荷'),U(Qt),''],[T('Tải hiển Qs|Sensible Qs|顕熱 Qs'),f1(Qs,2),'kW'],[T('Tải ẩn Ql|Latent Ql|潜熱 Ql'),f1(Ql,2),'kW'],[T('Công suất chọn coil|Selected coil capacity|選定コイル能力')+' ×'+f1(sf,2),U(Qd),''],[T('Nước ngưng|Condensate|凝縮水量'),f1(cond,1),'kg/h'],[T('Tải phòng hiển / ẩn (SA→RA)|Room sensible / latent (SA→RA)|室内顕熱 / 潜熱 (SA→RA)'),f1(rsh,2)+' / '+f1(rlh,2),'kW'],[T('RSHF thực tế|Actual RSHF|実RSHF'),f1(rsh/rt,3),'']]);
$('o2').innerHTML=W_+sumT+loads+cw;
const pts=[{...ra,n:'RA',c:'#2e7d32'},{...on,n:'ON',c:'#c0392b'},{...off,n:'OFF/SA',c:'#0b5394'},{...adp,n:'ADP',c:'#6a1b9a'}];const ln=[{p:[[on.t,on.W],[adp.t,adp.W]],c:'#0b5394',d:1},{p:[[off.t,off.W],[ra.t,ra.W]],c:'#2e7d32',d:1}];
if(mode!=='ra'){pts.unshift({...oa,n:'OA',c:'#e67e22'});if(mode==='mix')ln.unshift({p:[[oa.t,oa.W],[ra.t,ra.W]],c:'#666'})}
const svg=chart(pts,ln);$('c2').innerHTML=svg;
const o=id=>$(id).options[$(id).selectedIndex].text;
last[2]={title:T('Tính công suất lạnh AHU|AHU cooling capacity calculation|AHU冷却能力計算'),svg,res:W_+sumT+loads+cw,inp:tbl([[T('Lưu lượng|Airflow|風量'),Q,'m³/h'],[T('Khí vào coil|Coil entering air|コイル入口空気'),o('mode')+($('mode').value==='mix'?' – OA '+$('oap').value+'%':''),''],[T('Phương pháp|Method|方式'),o('meth'),''],['OA',`${$('oaT').value}°C ${$('oaK').value} ${$('oaV').value}`,''],['RA',`${$('raT').value}°C ${$('raK').value} ${$('raV').value}`,''],[T('Hệ số an toàn|Safety factor|安全率'),$('sf').value,'%'],[T('Loại coil|Coil type|コイル種別'),o('ct'),''],[T('Áp suất khí quyển|Atmospheric pressure|大気圧'),f1(P,3),'kPa']])}}
catch(e){$('o2').innerHTML='<div class="err">'+T(e.message)+'</div>';$('c2').innerHTML='';last[2]=null}}
/* ===== Report ===== */
function rep(n,print){const L=last[n];if(!L){alert('?');return}const g=i=>$(i).value||'–';
const html=`<!DOCTYPE html><html lang="${LG_[lang]}"><head><meta charset="utf-8"><title>${g('pn')} – ${L.title}</title><style>body{font:13px Segoe UI,Arial,"Yu Gothic";margin:22px;color:#111}h1{font-size:20px;border-bottom:3px solid #12354f;padding-bottom:6px}h2{font-size:14px;background:#12354f;color:#fff;padding:4px 8px;margin:14px 0 6px;-webkit-print-color-adjust:exact;print-color-adjust:exact}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:3px 6px;text-align:right}td:first-child,th:first-child{text-align:left}th{background:#eef3f8}svg{width:100%;height:auto}.warn{background:#fff3cd;padding:4px 8px;margin:4px 0}small{color:#555}</style></head><body>
<h1>${L.title}</h1><table><tr><td><b>${T('Dự án|Project|プロジェクト')}:</b> ${g('pn')}</td><td><b>${T('Hạng mục|Item|機器')}:</b> ${g('pa')}</td></tr><tr><td><b>${T('Khách hàng|Client|客先')}:</b> ${g('pc')}</td><td><b>${T('Người tính|Engineer|担当者')}:</b> ${g('pd')}</td></tr><tr><td><b>${T('Ngày|Date|日付')}:</b> ${g('pt')}</td><td><b>${T('Cao độ / Áp suất|Altitude / Pressure|標高 / 気圧')}:</b> ${g('alt')} m / ${f1(P,3)} kPa</td></tr><tr><td colspan="2"><b>${T('Ghi chú|Notes|備考')}:</b> ${g('pm')}</td></tr></table>
<h2>1. ${T('Thông số đầu vào|Input data|入力条件')}</h2>${L.inp}<h2>2. ${T('Kết quả|Results|計算結果')}</h2>${L.res}<h2>3. ${T('Biểu đồ không khí ẩm (ASHRAE, SI)|Psychrometric chart (ASHRAE style, SI)|湿り空気線図(ASHRAE形式, SI)')}</h2>${L.svg}
<h2>4. ${T('Cơ sở tính toán|Basis of calculation|計算根拠')}</h2><small>ASHRAE Handbook–Fundamentals Ch.1 (Hyland–Wexler): W=0.621945·pw/(p−pw); h=1.006t+W(2501+1.86t); v=0.287042(t+273.15)(1+1.607858W)/p; p=101.325(1−2.25577e-5·Z)^5.2559. Q=ṁ(h<sub>ON</sub>−h<sub>OFF</sub>); Qs=ṁ(1.006+1.86W)(t<sub>ON</sub>−t<sub>OFF</sub>); BF=(t<sub>OFF</sub>−t<sub>ADP</sub>)/(t<sub>ON</sub>−t<sub>ADP</sub>); Q<sub>w</sub>=Q/(4.186·ρ·ΔT). AHRI 410.</small></body></html>`;
if(print){const w=window.open('','_blank');if(!w){alert('Popup?');return}w.document.write(html);w.document.close();setTimeout(()=>w.print(),500)}
else{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([html],{type:'text/html'}));a.download=`Report_${g('pa')}_${g('pt')}.html`;a.click()}}
/* ===== wiring ===== */
const LG_=['vi','en','ja'];
function applyLang(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));document.documentElement.lang=LG_[lang]}
function vis(){const m=$('meth').value,md=$('mode').value,c=$('ct').value,sh=(s,v)=>document.querySelectorAll(s).forEach(e=>e.style.display=v?'':'none');
sh('.gm',md==='mix');document.querySelectorAll('.g2,.g3').forEach(e=>e.style.display=(e.classList.contains('g2')&&m==='m2')||(e.classList.contains('g3')&&m==='m3')?'':'none');sh('.cw',c==='w');sh('.cd',c==='dx')}
function run(){const A=+$('alt').value||0;P=101.325*Math.pow(1-2.25577e-5*A,5.2559);$('pp').value=f1(P,3);vis();calc1();calc2()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(e=>e.classList.remove('on'));b.classList.add('on');$(b.dataset.t1).classList.add('on')});
$('lg').onchange=()=>{lang=+$('lg').value;applyLang();run()};
document.addEventListener('input',run);document.addEventListener('change',e=>{if(e.target.id!=='lg')run()});
$('pt').value=new Date().toISOString().slice(0,10);applyLang();run();
</script></body></html>
