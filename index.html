.card{overflow-x:auto}.bad{outline:2px solid #e0a800!important;background:#fff8e1!important}input[type=range]{padding:0;margin:0;height:14px;border:0;background:none}.tg{background:#e8eef5;color:#12354f;border:1px solid #9fb3c8;border-radius:14px;padding:5px 10px;cursor:pointer;margin:0 6px 6px 0}.sm{border-left:4px solid #e0a800;background:#fffaf0;padding:6px 8px;margin:6px 0;border-radius:4px}.sm.ok{border-color:#2e7d32;background:#f1f9f1}.sm b{color:#7a4b00}.sm small{display:block;color:#444;margin:2px 0}.ap{background:#2e7d32;color:#fff;border:0;border-radius:4px;padding:5px 9px;cursor:pointer;margin:3px 6px 0 0}.tbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tbar button.a{margin:0}.sw{border:0;border-radius:12px;padding:5px 8px;background:#c9d4df;color:#334;font-weight:700;cursor:pointer;width:100%;font-size:12px}.sw.on{background:#2e7d32;color:#fff}nav{display:flex;gap:2px;background:#dfe6ee;padding:6px 12px 0}nav button{border-radius:6px 6px 0 0}.g2c{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:900px){.g2c{grid-template-columns:1fr}}</style></head><body><header><div class="top"><h1 data-t="HVAC Calc – Không khí ẩm & AHU|HVAC Calc – Psychrometrics & AHU|HVAC計算 – 湿り空気とAHU"></h1><div class="tbar"><button class="a" onclick="rep(cur,1)" data-t="📄 In / Lưu PDF|📄 Print / Save PDF|📄 印刷 / PDF保存"></button><button class="a" onclick="rep(cur,0)" data-t="⬇ Báo cáo .html|⬇ Report .html|⬇ レポート.html"></button><select id="lg" style="width:auto"><option value="0">Tiếng Việt</option><option value="1">English</option><option value="2">日本語</option></select></div></div>

<section id="t1" class="on"><div class="g2c"><div class="card"><div class="r"><label><i data-t="Thông số 1|Input 1|入力1"></i><select id="k1"></select></label><label><i data-t="Giá trị|Value|値"></i><input id="x1" type="number" step="any" value="35"></label><label><i data-t="Thông số 2|Input 2|入力2"></i><select id="k2"></select></label><label><i data-t="Giá trị|Value|値"></i><input id="x2" type="number" step="any" value="60"></label></div><div id="o1"></div></div><div class="card"><button class="tg dtg" onclick="togDet()"></button><div id="c1"></div></div></div></section>

<script>
const MOBILE=false;const $=i=>document.getElementById(i);let P=101.325,lang=0,DET=!MOBILE,SMART=true,cur=1,G={},SMH='',ALLFIX={};
const T=s=>{const a=s.split('|');return a[lang]||a[1]||a[0]};
/* ===== ASHRAE Fundamentals 2017 Ch.1 (Hyland-Wexler), SI ===== */
function pws(t){const T=t+273.15;const l=t<0?-5674.5359/T+6.3925247-9.677843e-3*T+6.2215701e-7*T*T+2.0747825e-9*T**3-9.484024e-13*T**4+4.1635019*Math.log(T):-5800.2206/T+1.3914993-4.8640239e-2*T+4.1764768e-5*T*T-1.4452093e-8*T**3+6.5459673*Math.log(T);return Math.exp(l)/1000}
const Wp=pw=>0.621945*pw/(P-pw),pwW=W=>P*W/(0.621945+W),Ws=t=>Wp(pws(t));
const hh=(t,W)=>1.006*t+W*(2501+1.86*t),vv=(t,W)=>0.287042*(t+273.15)*(1+1.607858*W)/P;
const tHW=(h,W)=>(h-2501*W)/(1.006+1.86*W);
const Wwb=(ts,t)=>((2501-2.326*ts)*Ws(ts)-1.006*(t-ts))/(2501+1.86*t-4.186*ts);
function bis(f,lo,hi){let fl=f(lo);for(let i=0;i<70;i++){const m=(lo+hi)/2,fm=f(m);if(fl*fm<=0)hi=m;else{lo=m;fl=fm}}return(lo+hi)/2}
const wbOf=(t,W)=>bis(ts=>Wwb(ts,t)-W,-60,t),dpOf=W=>{const pw=pwW(W);return bis(T=>pws(T)-pw,-80,100)};
const mk=(t,W)=>({t,W,rh:100*pwW(W)/pws(t),h:hh(t,W),v:vv(t,W),wb:wbOf(t,W),dp:dpOf(W),pw:pwW(W)});
function getW(t,k,x){switch(k){case'rh':return x>100||x<0?NaN:Wp(x/100*pws(t));case'wb':return x>t+1e-9?NaN:Wwb(x,t);case'dp':return x>t+1e-9?NaN:Wp(pws(x));case'w':return x/1000;case'h':return(x-1.006*t)/(2501+1.86*t)}}
function ck(k,t,W){if(!(W>=0)||W>Ws(t)*1.0005)return NaN;return{rh:100*pwW(W)/pws(t),wb:wbOf(t,W),dp:dpOf(W),w:W*1000,h:hh(t,W)}[k]}
function stateFrom(k1,x1,k2,x2){if(k1===k2)throw Error('Hai thông số phải khác nhau');if(k2==='db'){[k1,x1,k2,x2]=[k2,x2,k1,x1]}let t,W;
if(k1==='db'){t=x1;W=getW(t,k2,x2)}else{const f=t=>ck(k2,t,getW(t,k1,x1))-x2;let fa=f(-40),ok=false;
for(let a=-40;a<100&&!ok;a+=0.5){const fb=f(a+0.5);if(isFinite(fa)&&isFinite(fb)&&fa*fb<=0){t=bis(f,a,a+0.5);ok=true}fa=fb}
if(!ok)throw Error('Không tìm được trạng thái hợp lệ (kiểm tra giá trị nhập)');W=getW(t,k1,x1)}
if(!isFinite(W)||W<0||W>Ws(t)*1.0005)throw Error('Trạng thái không hợp lệ (quá bão hòa hoặc giá trị sai)');return mk(t,Math.min(W,Ws(t)))}
function adpLine(p0,p1){const d=0.01;for(let s=0;s<=80;s+=d){const t=p0[0]+s*(p1[0]-p0[0]),W=p0[1]+s*(p1[1]-p0[1]);if(W<0||t<-20)return null;if(W-Ws(t)>=0){if(s===0)return mk(t,Ws(t));const g=q=>{const tt=p0[0]+q*(p1[0]-p0[0]);return p0[1]+q*(p1[1]-p0[1])-Ws(tt)};const q=bis(g,s-d,s);const tt=p0[0]+q*(p1[0]-p0[0]);return mk(tt,Ws(tt))}}return null}










const f1=(x,d=1)=>isFinite(x)?(+x).toFixed(d):'–';
const KS={db:'Tdb °C',rh:'RH %',wb:'Twb °C',dp:'Tdp °C',w:'W g/kg',h:'h kJ/kg'};
const opts=(ks,sel)=>ks.map(k=>`<option value="${k}"${k===sel?' selected':''}>${KS[k]}</option>`).join('');
const fl=(t,h,c='')=>`<label class="${c}"><i data-t="${t}"></i>${h}</label>`;
const num=(id,v,st='any')=>`<input id="${id}" type="number" step="${st}" value="${v}" inputmode="decimal">`;
const sel=(id,o)=>`<select id="${id}">${o.map(x=>`<option value="${x[0]}" data-t="${x[1]}"></option>`).join('')}</select>`;
const sI=(id,t,k,v)=>fl('Tdb °C',num(id+'T',t,.1))+fl('Thông số 2|Param 2|項目2',`<select id="${id}K">${opts(['rh','wb','dp','w'],k)}</select>`)+fl('Giá trị|Value|値',num(id+'V',v));
$('k1').innerHTML=opts(Object.keys(KS),'db');$('k2').innerHTML=opts(Object.keys(KS),'rh');
const st=id=>stateFrom('db',+$(id+'T').value,$(id+'K').value,+$(id+'V').value);
const tbl=(rows,head)=>'<table>'+(head?'<tr>'+head.map(h=>`<th>${h}</th>`).join('')+'</tr>':'')+rows.map(r=>'<tr>'+r.map((c,i)=>`<td${i==r.length-1&&!head&&r.length==3?' class="u"':''}>${c}</td>`).join('')+'</tr>').join('')+'</table>';
const stRows=s=>[[T('Nhiệt độ bầu khô Tdb|Dry-bulb Tdb|乾球温度 Tdb'),f1(s.t,2),'°C'],[T('Bầu ướt Twb|Wet-bulb Twb|湿球温度 Twb'),f1(s.wb,2),'°C'],[T('Điểm sương Tdp|Dew point Tdp|露点温度 Tdp'),f1(s.dp,2),'°C'],[T('Độ ẩm tương đối RH|Relative humidity RH|相対湿度 RH'),f1(s.rh,1),'%'],[T('Độ ẩm tuyệt đối W|Humidity ratio W|絶対湿度 W'),f1(s.W*1000,2),'g/kg'],[T('Enthalpy h|Enthalpy h|比エンタルピー h'),f1(s.h,2),'kJ/kg'],[T('Thể tích riêng v|Specific volume v|比容積 v'),f1(s.v,4),'m³/kg'],[T('Khối lượng riêng ρ|Density ρ|密度 ρ'),f1((1+s.W)/s.v,3),'kg/m³'],[T('Áp suất hơi pw|Vapor pressure pw|水蒸気分圧 pw'),f1(s.pw,3),'kPa']];
/* ===== ASHRAE-style psychrometric chart (SI) ===== */
function chart(pts,lines){const Wd=MOBILE?430:840,H=MOBILE?580:560,l=MOBILE?32:50,r=MOBILE?40:60,tp=22,b=46,pw_=Wd-l-r,ph=H-tp-b;
let tmin=Math.floor(Math.min(0,Math.min(...pts.map(p=>p.t))-4)/5)*5,tmax=Math.ceil(Math.max(50,Math.max(...pts.map(p=>p.t))+4)/5)*5,wmax=Math.max(.030,Math.ceil((Math.max(...pts.map(p=>p.W))+.004)/.005)*.005);
const X=t=>l+(t-tmin)/(tmax-tmin)*pw_,Y=W=>tp+ph*(1-W/wmax),ins=(x,y)=>x>l&&x<l+pw_&&y>tp+6&&y<tp+ph;
const path=a=>a.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
const tx=(x,y,c,t,an='middle',fs=8)=>`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" fill="${c}" text-anchor="${an}" font-size="${fs}">${t}</text>`;
let s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${Wd} ${H}" font-family="Arial,sans-serif" font-size="10"><defs><clipPath id="cp"><rect x="${l}" y="${tp}" width="${pw_}" height="${ph}"/></clipPath></defs><rect x="${l}" y="${tp}" width="${pw_}" height="${ph}" fill="#fff" stroke="#222"/>`;
for(let t=tmin;t<=tmax;t+=DET?1:5)s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${tp}" y2="${tp+ph}" stroke="${t%5?'#eef0f3':'#c9ced6'}"/>`+(t%5==0?tx(X(t),tp+ph+13,'#222',t,'middle',10):'');
for(let w=0;w<=wmax+1e-9;w+=DET?.001:.005)s+=`<line x1="${l}" x2="${l+pw_}" y1="${Y(w)}" y2="${Y(w)}" stroke="${Math.round(w*1000)%5?'#eef0f3':'#c9ced6'}"/>`+(Math.round(w*1000)%5==0?tx(l+pw_+4,Y(w)+3,'#222',(w*1000).toFixed(0),'start',10):'');
s+=tx(l+pw_/2,H-6,'#222',T('Nhiệt độ bầu khô (°C)|Dry-bulb temperature (°C)|乾球温度 (°C)'),'middle',11)+tx(l+pw_,tp-8,'#222',T('Độ ẩm tuyệt đối W (g/kg)|Humidity ratio W (g/kg)|絶対湿度 W (g/kg)'),'end',10)+tx(l+2,tp-8,'#1d6fb8',T('Enthalpy h (kJ/kg) – xanh dương|Enthalpy h (kJ/kg) – blue|比エンタルピー h (kJ/kg) – 青'),'start',9)+'<g clip-path="url(#cp)">';
if(DET)for(let v=.76;v<1.0;v+=.02){const a=[];for(let t=tmin;t<=tmax;t++){const W=(v*P/(0.287042*(t+273.15))-1)/1.607858;if(W>=-.0003&&W<=Ws(t))a.push([t,Math.max(W,0)])}if(a.length>1){s+=`<path d="${path(a)}" stroke="#a0643c" stroke-width=".8" fill="none"/>`+tx(X(a[0][0]),Y(a[0][1])-3,'#a0643c',v.toFixed(2),'middle',8)}}
if(DET)for(let ts=Math.ceil(tmin);ts<=tmax;ts+=2){const w0=Ws(ts),t0=ts+(2501-2.326*ts)*w0/1.006,a=[];for(let k=0;k<=20;k++){const t=ts+(t0-ts)*k/20;a.push([t,Math.max(Wwb(ts,t),0)])}s+=`<path d="${path(a)}" stroke="#4c9a4c" stroke-width=".6" stroke-dasharray="3 2" fill="none"/>`;if(ts%4==0&&ts>0)s+=tx(X(ts)+2,Y(w0)+10,'#2e7d32',ts,'start',8)}
for(let h=-10;h<=160;h+=DET?5:10){const th=bis(t=>hh(t,Ws(t))-h,-60,90),t0=h/1.006,a=[];for(let k=0;k<=20;k++){const t=th+(t0-th)*k/20;a.push([t,Math.max((h-1.006*t)/(2501+1.86*t),0)])}s+=`<path d="${path(a)}" stroke="#1d6fb8" stroke-width="${h%10?.4:.9}" fill="none"/>`;if(h%10==0&&ins(X(th)-3,Y(Ws(th))-4))s+=tx(X(th)-3,Y(Ws(th))-4,'#1d6fb8',h,'end',9)}
for(let rh=DET?10:20;rh<100;rh+=DET?10:20){const a=[];for(let t=tmin;t<=tmax;t++)a.push([t,Wp(rh/100*pws(t))]);s+=`<path d="${path(a)}" stroke="#b33" stroke-width=".9" fill="none"/>`;const e=a.filter(p=>p[1]<wmax*.96).pop();if(e)s+=tx(X(e[0])-3,Y(e[1])-2,'#b33',rh+'%','end',9)}
const sat=[];for(let t=tmin;t<=tmax;t+=.5)sat.push([t,Ws(t)]);s+=`<path d="${path(sat)}" stroke="#000" stroke-width="2" fill="none"/>`;
lines.forEach(L=>s+=`<path d="${path(L.p)}" stroke="${L.c}" stroke-width="2.2" ${L.d?'stroke-dasharray="6 4"':''} fill="none"/>`);
pts.forEach(p=>s+=`<circle cx="${X(p.t)}" cy="${Y(p.W)}" r="4.5" fill="${p.c}" stroke="#fff"/><text x="${X(p.t)+7}" y="${Y(p.W)-6}" font-size="12" font-weight="bold" fill="${p.c}" stroke="#fff" stroke-width="3" paint-order="stroke">${p.n}</text>`);
return s+`</g>${tx(l+4,tp+ph-4,'#333','RH% – '+T('đỏ|red|赤')+(DET?' | Twb °C – '+T('xanh lá nét đứt|green dashed|緑破線')+' | v m³/kg – '+T('nâu|brown|茶'):'')+' | p = '+P.toFixed(2)+' kPa','start',9)}</svg>`}
/* ===== Tab 1 ===== */
let last={};
function calc1(){try{const k1=$('k1').value,k2=$('k2').value,s=stateFrom(k1,+$('x1').value,k2,+$('x2').value);
$('o1').innerHTML=tbl(stRows(s));const svg=chart([{...s,n:'●',c:'#c0392b'}],[{p:[[s.t,0],[s.t,s.W]],c:'#c0392b',d:1},{p:[[-60,s.W],[s.t,s.W]],c:'#c0392b',d:1}]);$('c1').innerHTML=svg;
last[1]={inp:tbl([[KS[k1],$('x1').value,''],[KS[k2],$('x2').value,''],[T('Áp suất khí quyển|Atmospheric pressure|大気圧'),f1(P,3),'kPa']]),res:tbl(stRows(s)),svg,title:T('Tính trạng thái không khí ẩm|Moist air state calculation|湿り空気の状態計算')}}
catch(e){$('o1').innerHTML='<div class="err">'+T(e.message)+'</div>';$('c1').innerHTML='';last[1]=null}}
/* ===== AHU figure with inline inputs ===== */
const MH={oa:138,ra:138,on:212,pre:140,coil:262,off:138,rh:140,hum:205,sa:104,rl:335,res:170};
const LYD={vb:[1420,578],c:{oa:[8,8,236,140],on:[256,8,276,178],coil:[544,8,310,218],res:[862,8,310,200],sa:[1010,205,170,115],rl:[1218,205,194,345],ra:[8,360,236,140],pre:[256,360,206,150],off:[474,360,230,150],rh:[716,360,206,150],hum:[934,360,264,175]}};
let LY=LYD;
function buildAhu(){const fo=(k,h)=>`<foreignObject id="fo_${k}" x="0" y="0" width="10" height="10"><div class="nd">${h}</div></foreignObject>`;const D=id=>`<div class="cv" id="cv_${id}"></div>`;
const sw=(id,t)=>`<label><i data-t="${t}"></i><button type="button" class="sw" data-s="${id}"></button><select id="${id}" style="display:none"><option value="off">off</option><option value="on">on</option></select></label>`;
$('ahu').innerHTML=`<svg id="ahusvg" viewBox="0 0 360 600" style="width:100%;background:#fff"><defs><marker id="ar" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8z" fill="#12354f"/></marker></defs><g id="artg"></g>`+
fo('oa',`<h4 data-t="① Gió tươi OA|① Outdoor air OA|① 外気 OA"></h4><div class="r">${sI('oa',35,'wb',28)}</div>${D('oa')}`)+

if(cc&&(bf<.03||bf>.3))add(m1?['saT','saV']:['bf'],`Bypass factor ${f1(bf,3)} ngoài 0.03–0.30|Bypass factor ${f1(bf,3)} is outside 0.03–0.30|バイパスファクタ ${f1(bf,3)} が0.03–0.30の外です`,'Thông lệ nhà sản xuất/ASHRAE: BF 0.05–0.20 (coil 6–8 hàng ≈0.05–0.10; 4 hàng ≈0.15–0.25). BF quá nhỏ cần coil rất sâu. Gợi ý: 0.10.|Manufacturer/ASHRAE practice: BF 0.05–0.20 (6–8 rows ≈0.05–0.10; 4 rows ≈0.15–0.25). Very small BF needs a very deep coil. Suggested: 0.10.|メーカー/ASHRAE通例:BF 0.05–0.20(6–8列≈0.05–0.10、4列≈0.15–0.25)。極小BFは非常に深いコイルが必要。推奨0.10。',m1?null:{bf:.1});
if(cc&&w){const a=v_('tin'),b=v_('tout');
if(adp.t<a+1.5)add(m1||c.meth==='m3'?['tin']:['adpt'],`ADP ${f1(adp.t)}°C quá gần/thấp hơn nước vào ${a}°C|ADP ${f1(adp.t)}°C is too close to / below entering water ${a}°C|ADP ${f1(adp.t)}°C が入口水温 ${a}°C に近すぎる/下回ります`,'Bề mặt coil không thể lạnh hơn nước vào; ADP phải cao hơn nước vào ít nhất ~1.5–3 K. Gợi ý: hạ nước vào hoặc tăng ADP.|Coil surface cannot be colder than entering water; ADP must exceed it by ~1.5–3 K. Suggested: lower water temperature or raise ADP.|コイル表面は入口水温より低くできません。ADPは約1.5–3K以上高く。入口水温を下げるかADPを上げてください。',c.meth==='m2'?{adpt:r(a+3)}:(adp.t-3>=4?{tin:r(adp.t-3),tout:r(adp.t+2)}:null));
if(b-a<4||b-a>8)add(['tin','tout'],`ΔT nước ${f1(b-a)} K ngoài 4–8 K|Water ΔT ${f1(b-a)} K is outside 4–8 K|水温差 ${f1(b-a)} K が4–8Kの外です`,'Chuẩn thông dụng 7/12°C (ΔT 5 K; AHRI 550/590 dùng 6.7/12.2°C). ΔT nhỏ tốn bơm, ΔT lớn cần coil sâu. Gợi ý: nước ra = vào + 5 K.|Common basis 7/12°C (ΔT 5 K; AHRI 550/590 uses 6.7/12.2°C). Small ΔT wastes pump energy, large ΔT needs deeper coil. Suggested: out = in + 5 K.|一般的な7/12°C(差5K、AHRI 550/590は6.7/12.2°C)。差が小さいとポンプ動力増、大きいとコイル深化。推奨:出口=入口+5K。',{tout:r(a+5)});
if(a<5||a>10)add(['tin'],`Nhiệt độ nước lạnh vào ${a}°C ngoài 5–10°C|Entering chilled water ${a}°C is outside 5–10°C|冷水入口 ${a}°C が5–10°Cの外です`,'Nước lạnh điều hòa thông dụng 6–8°C. Quá thấp tốn điện chiller/nguy cơ đóng băng; quá cao khó khử ẩm. Gợi ý: 7/12°C.|Comfort chilled water is typically 6–8°C. Too low wastes chiller energy / freezes; too high cannot dehumidify. Suggested: 7/12°C.|空調冷水は通常6–8°C。低すぎるとチラー動力増・凍結、高すぎると除湿不足。推奨7/12°C。',{tin:7,tout:12});
if(off.t-a<2.5&&adp.t>=a+1.5)add(['tin'],`Chênh nhiệt (approach) OFF-coil – nước vào chỉ ${f1(off.t-a)} K|Leaving-air approach to entering water is only ${f1(off.t-a)} K|出口空気と入口水温の差が ${f1(off.t-a)} K しかありません`,'Approach thông thường ≥ 3 K, nhỏ hơn cần coil rất lớn. Gợi ý: hạ nước vào hoặc nâng nhiệt độ OFF.|Typical approach is ≥ 3 K; smaller needs a very large coil. Suggested: lower water temperature or raise OFF temperature.|アプローチは通常3K以上。小さいと巨大なコイルが必要。入口水温を下げるかOFF温度を上げてください。',off.t-4>=5?{tin:r(off.t-4),tout:r(off.t+1)}:null)}
else if(cc){const e=v_('tev');
if(e<2||e>10||adp.t-e<3)add(['tev'],`Nhiệt độ bay hơi ${e}°C (ADP ${f1(adp.t)}°C) bất thường|Evaporating temperature ${e}°C (ADP ${f1(adp.t)}°C) is abnormal|蒸発温度 ${e}°C (ADP ${f1(adp.t)}°C) は異常です`,'DX điều hòa thường bay hơi 4–8°C, thấp hơn ADP ≥ 3–5 K; dưới 0°C dễ đóng tuyết. Gợi ý: ADP − 5 K trong khoảng 3–8°C.|Comfort DX evaporates at 4–8°C, ≥ 3–5 K below ADP; below 0°C risks frosting. Suggested: ADP − 5 K within 3–8°C.|空調用DXの蒸発温度は通常4–8°CでADPより3–5K以上低く、0°C未満は着霜の恐れ。推奨:ADP−5K(3–8°C)。',{tev:r(Math.min(8,Math.max(3,adp.t-5)))})}
if(c.meth==='m3'&&(v_('rshf')<.6||v_('rshf')>.95))add(['rshf'],`RSHF ${v_('rshf')} bất thường|RSHF ${v_('rshf')} is unusual|RSHF ${v_('rshf')} は異常です`,'Phòng điều hòa tiện nghi thường RSHF 0.7–0.9; dưới 0.6 thường cần gia nhiệt lại. Gợi ý: 0.80.|Comfort rooms typically have RSHF 0.7–0.9; below 0.6 usually needs reheat. Suggested: 0.80.|快適空調のRSHFは通常0.7–0.9、0.6未満は再熱が必要。推奨0.80。',{rshf:.8});
const k=c.Q/c.Qt;if(c.Qt>0&&(k<80||k>300))add(['q'],`Lưu lượng/công suất = ${f1(k,0)} m³/h trên kW|Airflow per kW = ${f1(k,0)} m³/h/kW|風量/能力 = ${f1(k,0)} m³/h/kW`,'Quy tắc ASHRAE 400 cfm/TR ≈ 193 m³/h trên kW cho phòng; AHU nhiều gió tươi thường thấp hơn, khoảng 80–300 là hợp lý). Ngoài khoảng này, hãy kiểm tra lại lưu lượng hoặc ΔT của SA.|ASHRAE rule of thumb 400 cfm/TR ≈ 193 m³/h per kW for rooms; AHUs with high outdoor air run lower, 80–300 is reasonable). Outside this, recheck airflow or SA ΔT.|ASHRAE目安 400 cfm/TR ≈ 193 m³/h/kW(室内用。外気量が多いAHUはより低め、80–300が妥当)。範囲外なら風量またはSA温度差を再確認。',null);
if(v_('sf')<5||v_('sf')>20)add(['sf'],`Hệ số an toàn ${v_('sf')}% bất thường|Safety factor ${v_('sf')}% is unusual|安全率 ${v_('sf')}% は異常です`,'Thông lệ chọn coil: dự phòng 5–15%. Quá lớn gây dư công suất, điều khiển ẩm kém. Gợi ý: 10%.|Typical coil selection margin is 5–15%. Too large oversizes and hurts humidity control. Suggested: 10%.|コイル選定の余裕は通常5–15%。過大だと過剰能力で湿度制御が悪化。推奨10%。',{sf:10});
if(hasRA&&sa.W>ra.W+.0003)add(['hurh','rht'],`Gió cấp ẩm hơn không khí phòng (W ${f1(sa.W*1000,1)} > ${f1(ra.W*1000,1)} g/kg)|Supply air is wetter than room air (W ${f1(sa.W*1000,1)} > ${f1(ra.W*1000,1)} g/kg)|給気が室内空気より多湿(W ${f1(sa.W*1000,1)} > ${f1(ra.W*1000,1)} g/kg)`,'Phòng bị cấp ẩm nên tải ẩn âm; chỉ hợp lý khi cần tăng ẩm (mùa đông). Nếu đang làm lạnh, hãy giảm RH đích phun ẩm hoặc tắt phun ẩm.|The room is being humidified, so its latent load is negative; valid only for winter humidification. In cooling, lower the target RH or turn the humidifier off.|室内が加湿されるため潜熱が負になります。冬季の加湿用途のみ妥当。冷房時は目標RHを下げるか加湿をOFFにしてください。',null);
if(c.hu&&v_('hurh')>90)add(['hurh'],`RH sau phun ẩm ${v_('hurh')}% gần bão hòa|Humidifier target RH ${v_('hurh')}% is near saturation|加湿後RH ${v_('hurh')}% は飽和に近い`,'Gần bão hòa dễ đọng nước, nấm mốc trong ống gió và giọt nước bị cuốn theo gió; thông lệ giữ ≤ 80–90%. Gợi ý: 80%.|Near saturation risks condensation, mold in ducts and droplet carry-over; keep ≤ 80–90%. Suggested: 80%.|飽和近傍はダクト内結露・カビ・水滴飛散の恐れ。80–90%以下に。推奨80%。',{hurh:80});
if(c.re&&cc)add(['rht'],`Reheat chạy đồng thời với làm lạnh|Reheat runs together with cooling|冷却と再熱が同時運転`,'Làm lạnh rồi sưởi lại tốn năng lượng; ASHRAE 90.1 (6.5.2) hạn chế, chỉ nên dùng để kiểm soát ẩm. Cân nhắc thu hồi nhiệt hoặc tăng ADP.|Cooling then reheating wastes energy; ASHRAE 90.1 (6.5.2) restricts it — use only for humidity control. Consider heat recovery or a higher ADP.|冷却後の再熱はエネルギーの無駄。ASHRAE 90.1(6.5.2)で制限、除湿制御のみに。熱回収やADP引き上げを検討。',null);
const capChk=(on,req,id,n,u)=>{if(!on||!(req>0))return;const c0=v_(id),sug=Math.ceil(req*1.15*2)/2;
if(req>c0+1e-6)add([id],`${n[0]} thiếu công suất: lắp ${c0} ${u} < cần ${f1(req,1)} ${u}|${n[1]} undersized: installed ${c0} ${u} < required ${f1(req,1)} ${u}|${n[2]}容量不足:設置 ${c0} ${u} < 必要 ${f1(req,1)} ${u}`,`Nếu thiếu công suất thì không đạt nhiệt độ/độ ẩm đích. Chọn ≥ tải tính toán + 10–20% dự phòng. Gợi ý: ${sug} ${u}.|With too little capacity the target is not reached. Select ≥ calculated load + 10–20% margin. Suggested: ${sug} ${u}.|容量不足だと目標に届きません。計算負荷+10〜20%以上を選定。推奨: ${sug} ${u}。`,{[id]:sug});
else if(c0>req*3)add([id],`${n[0]} lắp lớn hơn 3 lần tải cần (${c0} so với ${f1(req,1)} ${u})|${n[1]} installed capacity is over 3× the load (${c0} vs ${f1(req,1)} ${u})|${n[2]}の設置容量が負荷の3倍超(${c0} / ${f1(req,1)} ${u})`,`Công suất quá lớn làm điều khiển kém ổn định và tốn đầu tư. Gợi ý: ${sug} ${u}.|Oversizing hurts control stability and adds cost. Suggested: ${sug} ${u}.|過大容量は制御が不安定でコスト増。推奨: ${sug} ${u}。`,{[id]:sug})};
capChk(c.pre,c.reqPre,'prc',['Gia nhiệt sơ bộ','Pre-heater','プレヒーター'],'kW');capChk(c.re,c.reqRe,'rhc',['Reheat','Reheater','再熱ヒーター'],'kW');capChk(c.hu,c.reqHu,'huc',['Phun ẩm','Humidifier','加湿器'],'kg/h');
I.forEach(x=>{if(x.fix)Object.assign(ALLFIX,x.fix)});
SMH=I.length?I.map(x=>`<div class="sm"><b>⚠ ${T(x.m)}</b><small>${T(x.w)}</small>${x.fix?`<button class="ap" data-fix='${JSON.stringify(x.fix)}'>${T('Áp dụng|Apply|適用')}: ${Object.keys(x.fix).map(k=>k+'='+x.fix[k]).join(', ')}</button>`:''}</div>`).join(''):`<div class="sm ok">✅ ${T('Các thông số nằm trong khoảng thông lệ (ASHRAE 55/62.1, AHRI 550/590, nhà sản xuất).|All parameters are within typical ranges (ASHRAE 55/62.1, AHRI 550/590, manufacturers).|全パラメータが通常範囲内です(ASHRAE 55/62.1、AHRI 550/590、メーカー)。')}</div>`;
$('sm').innerHTML=SMH}
function applyAll(){for(let i=0;i<4;i++){const f={...ALLFIX};let ch=false;for(const k in f)if($(k).value!=f[k]){$(k).value=f[k];ch=true}if(!ch)break;run()}}
function applyFix(f){for(const k in f)$(k).value=f[k];run()}
document.addEventListener('click',e=>{const w=e.target.closest('.sw');if(w){const id=w.dataset.s,x=$(id);x.value=x.value==='on'?'off':'on';if(x.value==='on'&&G.mix){if(id==='pre'&&v_('prt')<=G.mix.t)$('prt').value=Math.ceil(G.mix.t+5);if(id==='rhs'&&v_('rht')<=G.off.t)$('rht').value=Math.ceil(G.off.t+8);if(id==='hue'&&v_('hurh')<=G.off2.rh)$('hurh').value=Math.min(90,Math.ceil(G.off2.rh+15))}run();return}const b=e.target.closest('.ap[data-fix]');if(b)applyFix(JSON.parse(b.dataset.fix))});
const togDet=()=>{DET=!DET;run()},togSmart=()=>{SMART=!SMART;run()};
function lab(){document.querySelectorAll('.dtg').forEach(b=>b.textContent=T('📈 Biểu đồ: |📈 Chart: |📈 線図: ')+(DET?T('Chi tiết|Detailed|詳細'):T('Đơn giản|Simple|簡易')));$('smb').textContent=T('🧠 Kiểm tra thông minh: |🧠 Smart assist: |🧠 スマート支援: ')+(SMART?'ON':'OFF');$('apall').style.display=SMART&&Object.keys(ALLFIX).length?'':'none';document.querySelectorAll('.sw').forEach(b=>{const o=$(b.dataset.s).value==='on';b.textContent=o?'● ON':'○ OFF';b.className='sw'+(o?' on':'')})}
/* ===== Room cooling load -> airflow / supply T / quick coil capacity ===== */
let RL=null;
function roomCalc(ra,on,Q,hasRA){const el=$('cv_rl');RL=null;if(!hasRA){el.innerHTML='';return}
try{const m=$('rlm').value,rsh=v_('rsh'),rlh=v_('rlh'),hl=2501+1.86*ra.t;let ma,ts,wsa;
if(m==='ts'){ts=v_('rts');const dT=ra.t-ts;if(dT<=0)throw Error('T gió cấp phải thấp hơn nhiệt độ phòng|Supply T must be below room temperature|給気温度は室温より低く設定してください');wsa=ra.W;ma=rsh/((1.006+1.86*wsa)*dT);for(let i=0;i<40;i++){wsa=ra.W-rlh/(ma*hl);ma=rsh/((1.006+1.86*Math.max(wsa,0))*dT)}}
else{ma=$('qb').value==='on'?Q/3600/on.v:Q/3600*1.2;wsa=ra.W-rlh/(ma*hl);ts=ra.t-rsh/(ma*(1.006+1.86*wsa));$('rts').value=f1(ts,2)}
$('rts').disabled=m==='q';
if(wsa<=0.0003)throw Error('Tải ẩn quá lớn so với lưu lượng: W gió cấp ≤ 0|Latent load too large for this airflow: supply W ≤ 0|潜熱が風量に対し過大:給気W≦0');
const sat=wsa>Ws(ts)*1.0005,sa=mk(ts,Math.min(wsa,Ws(ts))),Qv=$('qb').value==='on'?ma*3600*on.v:ma*3600/1.2,qc=ma*(G.on.h-sa.h),rshf=rsh/(rsh+rlh),dT=ra.t-ts;
RL={Q:Qv,ts,wsa};
el.innerHTML=`<b>${T('Lưu lượng gió cần|Required airflow|必要風量')}: ${f1(Qv,0)} m³/h</b> (${f1(Qv/3.6,0)} L/s)<br>${T('Gió cấp|Supply air|給気')}: ${f1(ts,1)}°C | W ${f1(sa.W*1000,2)} g/kg | RH ${f1(sa.rh,0)}%<br>ΔT ${f1(dT,1)} K | RSHF ${f1(rshf,2)} | ${T('Tải phòng|Room load|室内負荷')} ${f1(rsh+rlh,1)} kW<br><b>${T('Coil ước tính|Est. coil load|コイル概算')}: ${f1(qc,1)} kW = ${f1(qc/3.517,1)} TR</b>`+(sat?`<br>⚠ ${T('W gió cấp vượt bão hòa ở nhiệt độ này – tăng T gió cấp hoặc giảm tải ẩn|Supply W exceeds saturation at this temperature – raise supply T or lower latent load|この温度で給気Wが飽和超過 – 給気温度を上げるか潜熱を下げる')}`:'')+((dT<6||dT>14)?`<br>⚠ ΔT ${f1(dT,1)} K ${T('ngoài 6–14 K (ASHRAE: 8–12 K)|outside 6–14 K (ASHRAE: 8–12 K)|6–14K外(ASHRAE:8–12K)')}`:'')+(($('rhs').value==='on'||$('hu').value!=='off')?`<br>ℹ ${T('Reheat/phun ẩm đang bật: SA cuối khác OFF-coil|Reheat/humidifier is on: final SA differs from coil OFF|再熱/加湿ON:最終SAはコイルOFFと異なる')}`:'')}
catch(e){el.innerHTML='⚠ '+T(e.message)}}
function applyRoom(){if(!RL)return;$('q').value=Math.round(RL.Q);$('cc').value='on';$('meth').value='m1';$('saT').value=f1(RL.ts,2);$('saK').value='w';$('saV').value=f1(RL.wsa*1000,2);run()}
/* ===== wiring ===== */
const LG_=['vi','en','ja'];
function applyLang(){document.querySelectorAll('[data-t]').forEach(e=>e.textContent=T(e.dataset.t));document.documentElement.lang=LG_[lang]}
function vis(){const m=$('meth').value,md=$('mode').value,c=$('ct').value,sh=(s,v)=>document.querySelectorAll(s).forEach(e=>e.style.display=v?'':'none');
sh('.gm',md==='mix');document.querySelectorAll('.g2,.g3').forEach(e=>e.style.display=(e.classList.contains('g2')&&m==='m2')||(e.classList.contains('g3')&&m==='m3')?'':'none');sh('.cw',c==='w');sh('.cd',c==='dx');const cc=$('cc').value==='on';sh('.gpre',$('pre').value==='on');sh('.grh',$('rhs').value==='on');sh('.ghu',$('hu').value!=='off');sh('.ghus',$('hu').value==='spray');['meth','ct','sf'].forEach(i=>$(i).closest('label').style.display=cc?'':'none');if(!cc)['bf','adpt','rshf','tin','tout','tev','rf'].forEach(i=>$(i).closest('label').style.display='none');$('meth').querySelector('[value=m3]').disabled=md==='pau'}
function run(){const A=+$('alt').value||0;P=101.325*Math.pow(1-2.25577e-5*A,5.2559);$('pp').value=f1(P,3);$('hu').value=$('hue').value==='on'?$('hut').value:'off';if($('mode').value==='pau'&&$('meth').value==='m3')$('meth').value='m2';layout();vis();calc1();calc2();updateSliders();lab()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button,section').forEach(e=>e.classList.remove('on'));b.classList.add('on');$(b.dataset.t1).classList.add('on');cur=b.dataset.t1==='t1'?1:2});
$('lg').onchange=()=>{lang=+$('lg').value;applyLang();run()};
document.addEventListener('input',run);document.addEventListener('change',e=>{if(e.target.id!=='lg')run()});
$('pt').value=new Date().toISOString().slice(0,10);applyLang();run();
